<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GlobalTrotter – Screen 9</title>

<style>
body{
  margin:0;
  font-family:Segoe UI, Arial, sans-serif;
  background:#f4f6fb;
}

header{
  background:#0f172a;
  color:white;
  padding:15px 25px;
}

.container{
  width:90%;
  max-width:1100px;
  margin:25px auto;
  background:white;
  padding:25px;
  border-radius:14px;
  box-shadow:0 8px 20px rgba(0,0,0,.1);
}

h2{text-align:center}

.day{
  border:1px solid #cbd5f5;
  border-radius:12px;
  padding:15px;
  margin-bottom:20px;
}

.day-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.activity{
  display:grid;
  grid-template-columns:1fr 150px;
  gap:10px;
  margin-top:10px;
}

input{
  padding:10px;
  border-radius:8px;
  border:1px solid #cbd5f5;
}

button{
  padding:8px 14px;
  border-radius:8px;
  border:none;
  cursor:pointer;
}

.add{
  background:#e0e7ff;
}

.add-day{
  width:100%;
  margin-top:15px;
  border:2px dashed #cbd5f5;
  background:white;
}

.total{
  text-align:right;
  font-weight:600;
  margin-top:10px;
}

.grand{
  text-align:right;
  font-size:18px;
  font-weight:700;
  margin-top:20px;
  color:#2563eb;
}
</style>
</head>

<body>

<header>
  <h3>GlobalTrotter</h3>
</header>

<div class="container">

  <h2>Itinerary for a Selected Place</h2>

  <div id="days"></div>

  <button class="add-day" onclick="addDay()">＋ Add Day</button>

  <div class="grand">
    Total Trip Expense: ₹ <span id="grandTotal">0</span>
  </div>

</div>

<script>
let dayNo = 0;

function addDay(){
  dayNo++;

  const d = document.createElement("div");
  d.className = "day";

  d.innerHTML = `
    <div class="day-header">
      <strong>Day ${dayNo}</strong>
      <button class="add" onclick="addActivity(this)">+ Activity</button>
    </div>
    <div class="acts"></div>
    <div class="total">Day Total: ₹ <span>0</span></div>
  `;

  document.getElementById("days").appendChild(d);
}

function addActivity(btn){
  const box = btn.parentElement.nextElementSibling;

  const a = document.createElement("div");
  a.className = "activity";

  const act = document.createElement("input");
  act.placeholder = "Physical Activity";

  const cost = document.createElement("input");
  cost.type = "number";
  cost.placeholder = "Expense";
  cost.oninput = calculate;

  a.appendChild(act);
  a.appendChild(cost);
  box.appendChild(a);
}

function calculate(){
  let grand = 0;

  document.querySelectorAll(".day").forEach(d=>{
    let dayTotal = 0;
    d.querySelectorAll("input[type='number']").forEach(i=>{
      dayTotal += Number(i.value) || 0;
    });
    d.querySelector(".total span").innerText = dayTotal;
    grand += dayTotal;
  });

  document.getElementById("grandTotal").innerText = grand;
}

addDay(); // default Day 1
</script>

</body>
</html>
