<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Create New Trip | GlobalTrotter</title>

<style>
:root{
  --primary:#2563eb;
  --secondary:#0f172a;
  --bg:#f4f6fb;
  --border:#d1d5ff;
}

*{
  box-sizing:border-box;
  font-family:"Segoe UI", Arial, sans-serif;
}

body{
  margin:0;
  background:var(--bg);
}

/* Header */
header{
  background:var(--secondary);
  color:white;
  padding:14px 28px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header h2{
  margin:0;
  font-weight:600;
}

/* Page Wrapper */
.page{
  width:90%;
  max-width:1100px;
  margin:25px auto;
  background:white;
  border-radius:16px;
  box-shadow:0 8px 22px rgba(0,0,0,0.08);
  padding:24px;
}

/* Section Divider */
.section{
  border-bottom:1px solid var(--border);
  padding-bottom:20px;
  margin-bottom:20px;
}

.section h3{
  margin:0 0 18px;
  font-size:18px;
  font-weight:600;
}

/* Form Rows */
.form-row{
  display:grid;
  grid-template-columns:180px 1fr;
  align-items:center;
  gap:16px;
  margin-bottom:14px;
}

.form-row label{
  font-weight:500;
}

.form-row input{
  padding:10px 12px;
  border-radius:8px;
  border:1px solid var(--border);
  font-size:14px;
}

/* Suggestion Section */
.suggestion-title{
  font-size:17px;
  font-weight:600;
  margin-bottom:18px;
}

.suggestion-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.suggestion-card{
  height:190px;
  border-radius:14px;
  border:2px dashed #cbd5f5;
  background:#f9fafb;
}

/* Responsive */
@media(max-width:900px){
  .suggestion-grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:600px){
  .form-row{
    grid-template-columns:1fr;
  }
  .suggestion-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <h2>GlobalTrotter</h2>
  <div style="width:36px;height:36px;border-radius:50%;background:#e0e7ff"></div>
</header>

<div class="page">

  <!-- PLAN NEW TRIP SECTION -->
  <div class="section">
    <h3>Plan a new trip</h3>

    <div class="form-row">
      <label>Start Date :</label>
      <input type="date">
    </div>

    <div class="form-row">
      <label>Select a Place :</label>
      <input type="text" placeholder="Enter destination">
    </div>

    <div class="form-row">
      <label>Travel Start Date :</label>
      <input type="date">
    </div>

    <div class="form-row">
      <label>End Date :</label>
      <input type="date">
    </div>
  </div>

  <!-- SUGGESTIONS -->
  <div>
    <div class="suggestion-title">
      Suggestion for Places to Visit / Activities to perform
    </div>

    <div class="suggestion-grid">
      <div class="suggestion-card"></div>
      <div class="suggestion-card"></div>
      <div class="suggestion-card"></div>
      <div class="suggestion-card"></div>
      <div class="suggestion-card"></div>
      <div class="suggestion-card"></div>
    </div>
  </div>

</div>

</body>
</html>
