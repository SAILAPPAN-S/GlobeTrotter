{% extends "base.html" %}
{% block content %}
<style>
    :root {
        --dark-bg: #111;
        --card-bg: #f5f5f5;
        --border-color: #333;
        --text-muted: #888;
    }

    body {
        background-color: var(--dark-bg);
        color: white;
    }

    .calendar-container {
        padding: 20px;
        max-width: 1200px;
        margin: 0 auto;
    }

    /* Page Title */
    .calendar-title {
        text-align: center;
        margin-bottom: 20px;
        font-family: 'Courier New', Courier, monospace;
        font-size: 1.5rem;
    }

    /* Calendar Widget */
    .calendar-card {
        background-color: var(--card-bg);
        color: #333;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .calendar-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 40px;
        font-weight: bold;
        font-size: 1.2rem;
    }

    .nav-arrow {
        cursor: pointer;
        font-size: 1.5rem;
        user-select: none;
    }

    .calendar-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        border-top: 1px solid #ddd;
    }

    .weekday {
        text-align: center;
        padding: 10px 0;
        font-size: 0.8rem;
        font-weight: bold;
        color: #555;
        border-bottom: 1px solid #ddd;
    }

    .calendar-day {
        min-height: 100px;
        border-right: 1px solid #ddd;
        border-bottom: 1px solid #ddd;
        padding: 5px;
        position: relative;
    }

    .calendar-day:nth-child(7n) {
        border-right: none;
    }

    .day-number {
        font-size: 0.9rem;
        margin-bottom: 5px;
    }

    .event-bar {
        font-size: 0.75rem;
        background: #ddd;
        padding: 2px 5px;
        margin-bottom: 2px;
        border-radius: 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        cursor: pointer;
        z-index: 10;
        position: relative;
    }

    .event-bar.nyc {
        background-color: #999;
        color: white;
    }

    .event-bar.paris {
        background-color: #eee;
        border: 1px solid #ccc;
    }

    .event-bar.japan {
        background-color: #bbb;
    }

    .highlight-day {
        background-color: #e0e0e0;
    }
</style>

<div class="calendar-container">
    <!-- Calendar View Title -->
    <h2 class="calendar-title">Calendar View</h2>

    <!-- Calendar Widget -->
    <div class="calendar-card">
        <div class="calendar-header">
            <span class="nav-arrow" id="prevMonth">&larr;</span>
            <span id="monthDisplay">January 2024</span>
            <span class="nav-arrow" id="nextMonth">&rarr;</span>
        </div>

        <div class="calendar-grid" id="calendarGrid">
            <!-- Weekdays -->
            <div class="weekday">SUM</div>
            <div class="weekday">MON</div>
            <div class="weekday">TUE</div>
            <div class="weekday">WED</div>
            <div class="weekday">THU</div>
            <div class="weekday">FRI</div>
            <div class="weekday">SAT</div>
            <!-- Days will be injected here -->
        </div>
    </div>
</div>

<div id="calendar-data"
    data-sections='[{% for section in trip.dateranges %}{"sectionname": {{ section.sectionname | tojson | safe }}, "startdate": "{{ section.startdate }}", "enddate": "{{ section.enddate }}"}{% if not loop.last %},{% endif %}{% endfor %}]'
    data-startdate="{{ trip.startdate }}">
</div>

<script>
    const dataEl = document.getElementById('calendar-data');
    const tripSections = JSON.parse(dataEl.dataset.sections || '[]');
    const monthDisplay = document.getElementById('monthDisplay');
    const calendarGrid = document.getElementById('calendarGrid');

    let currentDate = new Date();
    // Default to trip start date if available
    const tripStartStr = dataEl.dataset.startdate;
    if (tripStartStr) {
        const tripStart = new Date(tripStartStr);
        if (!isNaN(tripStart)) currentDate = tripStart;
    }

    function renderCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();

        const monthNames = ["January", "February", "March", "April", "May", "June",
            "July", "August", "September", "October", "November", "December"];

        monthDisplay.innerText = `${monthNames[month]} ${year}`;

        // Clear previous days
        const gridItems = calendarGrid.querySelectorAll('.calendar-day');
        gridItems.forEach(item => item.remove());

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        // Previous month padding
        const prevMonthLastDay = new Date(year, month, 0).getDate();
        for (let i = firstDay - 1; i >= 0; i--) {
            const dayDiv = document.createElement('div');
            dayDiv.className = 'calendar-day text-muted';
            dayDiv.innerHTML = `<div class="day-number" style="opacity: 0.3">${prevMonthLastDay - i}</div>`;
            calendarGrid.appendChild(dayDiv);
        }

        // Current month days
        for (let i = 1; i <= daysInMonth; i++) {
            const dayDiv = document.createElement('div');
            dayDiv.className = 'calendar-day';
            dayDiv.innerHTML = `<div class="day-number">${i}</div>`;

            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;

            // Render events for this day
            tripSections.forEach(section => {
                if (dateStr >= section.startdate && dateStr <= section.enddate) {
                    const eventDiv = document.createElement('div');
                    eventDiv.className = 'event-bar';
                    // Simple color cycling based on name
                    if (section.sectionname.toLowerCase().includes('nyc')) eventDiv.classList.add('nyc');
                    else if (section.sectionname.toLowerCase().includes('paris')) eventDiv.classList.add('paris');
                    else if (section.sectionname.toLowerCase().includes('japan')) eventDiv.classList.add('japan');

                    eventDiv.innerText = section.sectionname;
                    dayDiv.appendChild(eventDiv);

                    // Highlight day if it has an event
                    dayDiv.classList.add('highlight-day');
                }
            });

            calendarGrid.appendChild(dayDiv);
        }
    }

    document.getElementById('prevMonth').onclick = () => {
        currentDate.setMonth(currentDate.getMonth() - 1);
        renderCalendar();
    };

    document.getElementById('nextMonth').onclick = () => {
        currentDate.setMonth(currentDate.getMonth() + 1);
        renderCalendar();
    };

    renderCalendar();
</script>
{% endblock %}
