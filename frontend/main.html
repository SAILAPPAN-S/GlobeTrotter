<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GlobalTrotter – Home</title>

<style>
:root{
  --primary:#2563eb;
  --secondary:#0f172a;
  --bg:#f8fafc;
  --card:#ffffff;
}

*{
  box-sizing:border-box;
  font-family:"Segoe UI", sans-serif;
}

body{
  margin:0;
  background:var(--bg);
}

/* Header */
header{
  background:var(--secondary);
  color:white;
  padding:14px 28px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header h2{
  margin:0;
  font-weight:600;
}

/* Layout */
.container{
  width:90%;
  max-width:1200px;
  margin:25px auto;
}

/* Banner */
.banner{
  height:260px;
  background:linear-gradient(135deg,#dbeafe,#e0e7ff);
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:36px;
  font-weight:600;
  color:#334155;
  margin-bottom:20px;
}

/* Search Row */
.search-row{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

.search-row input{
  flex:1;
  padding:12px;
  border-radius:10px;
  border:1px solid #cbd5f5;
}

.search-row button{
  padding:12px 16px;
  border:none;
  border-radius:10px;
  background:#e0e7ff;
  cursor:pointer;
  font-weight:500;
}

/* Section Title */
.section-title{
  font-size:20px;
  font-weight:600;
  margin:20px 0 10px;
}

/* Card Grids */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:16px;
}

/* Region Cards */
.region-card{
  height:130px;
  border-radius:14px;
  background:var(--card);
  box-shadow:0 6px 16px rgba(0,0,0,0.08);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:600;
  color:var(--primary);
}

/* Trip Cards */
.trip-card{
  height:220px;
  border-radius:16px;
  background:var(--card);
  box-shadow:0 8px 20px rgba(0,0,0,0.1);
  padding:15px;
  display:flex;
  align-items:flex-end;
  font-weight:600;
}

/* Plan Button */
.plan-btn{
  margin-top:20px;
  display:flex;
  justify-content:flex-end;
}

.plan-btn button{
  padding:12px 18px;
  border-radius:12px;
  border:none;
  background:var(--primary);
  color:white;
  font-size:15px;
  cursor:pointer;
}
</style>
</head>

<body>

<header>
  <h2>GlobalTrotter</h2>
  <div style="width:36px;height:36px;border-radius:50%;background:#e0e7ff"></div>
</header>

<div class="container">

  <!-- Banner -->
  <div class="banner">
    Banner Image
  </div>

  <!-- Search -->
  <div class="search-row">
    <input placeholder="Search bar ......">
    <button>Group by</button>
    <button>Filter</button>
    <button>Sort by</button>
  </div>

  <!-- Top Regions -->
  <div class="section-title">Top Regional Selections</div>
  <div class="grid">
    <div class="region-card"></div>
    <div class="region-card"></div>
    <div class="region-card"></div>
    <div class="region-card"></div>
    <div class="region-card"></div>
  </div>

  <!-- Previous Trips -->
  <div class="section-title">Previous Trips</div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">
    <div class="trip-card"></div>
    <div class="trip-card"></div>
    <div class="trip-card"></div>
  </div>

  <!-- Plan Button -->
  <div class="plan-btn">
    <button>＋ Plan a trip</button>
  </div>

</div>

</body>
</html>
