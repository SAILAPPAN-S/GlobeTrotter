{% extends "base.html" %}
{% block content %}
<div class="container">
    <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
            <h1 class="h3 mb-1">Trip Calendar</h1>
            <p class="text-muted mb-0">All your trips in one calendar view.</p>
        </div>
        <a href="{{ url_for('create_trip') }}" class="btn btn-success">+ Plan a Trip</a>
    </div>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.min.css">
    <div class="card shadow-sm">
        <div class="card-body">
            {% if calendar_events %}
            <div id="trip-calendar"></div>
            {% else %}
            <div class="alert alert-info mb-0">No trips scheduled yet. Create one to see it on the calendar.</div>
            {% endif %}
        </div>
    </div>
</div>

{% if calendar_events %}
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        var calendarEl = document.getElementById('trip-calendar');
        if (!calendarEl) return;

        var events = {{ calendar_events|tojson|safe }};

        var calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,listMonth'
            },
            events: events.map(function(evt) {
                return Object.assign({ allDay: true }, evt);
            }),
            height: 'auto'
        });

        calendar.render();
    });
</script>
{% endif %}
{% endblock %}
